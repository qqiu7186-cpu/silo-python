[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silo-python-sdk"
version = "0.1.1"
description = "Unofficial Silo client preserving the MinIO Python SDK API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["minio==7.2.20"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Silo server and SILO_* credentials"]
